<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Ludothèque Monge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: gros sélecteur "on est combien" en tête, filtres secondaires, étagère de boîtes en grille, fiche en dialog */
:root{
  --bg:#f3f2f7; --surface:#ffffff; --ink:#1d1b2e; --muted:#5f5b78; --line:#dcd9e8;
  --accent:#e2572b; --accent-ink:#ffffff; --chip:#e8e6f1;
  --coop:#2f7d6b; --solo:#4a5bd1; --team:#b0479a; --hidden:#a8761b; --party:#c2413b;
  --display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15141f; --surface:#1f1d2c; --ink:#eeecf7; --muted:#a6a2bf; --line:#34314a;
  --accent:#ff7a4d; --accent-ink:#1a0f0a; --chip:#2a2839;
  --coop:#5cc4ab; --solo:#8b98ff; --team:#e584d0; --hidden:#e3b25a; --party:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15141f; --surface:#1f1d2c; --ink:#eeecf7; --muted:#a6a2bf; --line:#34314a;
  --accent:#ff7a4d; --accent-ink:#1a0f0a; --chip:#2a2839;
  --coop:#5cc4ab; --solo:#8b98ff; --team:#e584d0; --hidden:#e3b25a; --party:#ff8a80; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}

.hero{display:grid;gap:14px;margin-bottom:26px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,8vw,76px);line-height:.92;margin:0;letter-spacing:-.025em;text-wrap:balance}
h1 .n{color:var(--accent);font-variant-numeric:tabular-nums;display:inline-block;min-width:1.1ch}
.picker{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;max-width:760px}
.pk{font-family:var(--display);font-weight:800;font-size:clamp(20px,4vw,30px);font-variant-numeric:tabular-nums;
  border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;
  aspect-ratio:1/1;max-width:100%;cursor:pointer;display:grid;place-items:center;padding:0;transition:transform .12s ease}
.pk:hover{transform:translateY(-2px);border-color:var(--muted)}
.pk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (max-width:520px){.picker{grid-template-columns:repeat(5,1fr)}}
.lede{color:var(--muted);margin:0;max-width:60ch}

.filters{display:flex;flex-wrap:wrap;gap:16px;margin:0 0 18px}
.fgroup{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fgroup span{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  padding:6px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.pk:focus-visible,.game:focus-visible,.close:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.count{font-size:14px;color:var(--muted);margin-bottom:12px;font-variant-numeric:tabular-nums}
.count b{color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.game{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:10px 1fr;
  background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0;
  transition:transform .15s ease, border-color .15s ease}
.game:hover{transform:translateY(-2px);border-color:var(--muted)}
.spine{background:var(--c)}
.gbody{padding:14px 14px 12px;display:grid;gap:6px;min-width:0;align-content:start}
.gname{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1;letter-spacing:-.01em}
.gtag{font-size:13.5px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--ink);font-variant-numeric:tabular-nums}
.pill.dyn{color:var(--bg);background:var(--c);font-weight:700}
.empty{padding:40px 0;color:var(--muted)}

dialog{border:none;padding:0;background:var(--surface);color:var(--ink);border-radius:10px;
  width:min(560px, calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(15,13,25,.55)}
.dhead{background:var(--c);color:#fff;padding:22px 22px 18px;position:relative}
.dhead .eyebrow{color:rgba(255,255,255,.85)}
.dhead h2{font-family:var(--display);font-weight:800;font-size:32px;line-height:1;margin:6px 40px 0 0;text-wrap:balance}
.close{position:absolute;top:12px;right:12px;font:inherit;font-size:20px;line-height:1;border:none;cursor:pointer;
  background:rgba(255,255,255,.2);color:#fff;width:34px;height:34px;border-radius:50%}
.dbody{padding:20px 22px 24px;display:grid;gap:16px}
.dbody h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.dbody p{margin:0;max-width:62ch}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.fact b{display:block;font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.fact small{color:var(--muted);font-size:12px}
.range{display:flex;gap:4px;align-items:end}
.range i{flex:1;height:10px;border-radius:2px;background:var(--chip)}
.range i.on{background:color-mix(in srgb,var(--c) 45%, var(--chip))}
.range i.sel{background:var(--c);height:18px}
.rlabels{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:3px}
@media (max-width:440px){.facts{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){.game,.pk{transition:none}.game:hover,.pk:hover{transform:none}}
</style>
</head>
<body>

<div class="wrap">
  <section class="hero">
    <div class="eyebrow">Ludothèque Monge</div>
    <h1>On est <span class="n" id="big">4</span>, on joue à quoi ?</h1>
    <div class="picker" id="picker" role="group" aria-label="Nombre de joueurs"></div>
    <p class="lede">Choisis combien vous êtes : la liste ne garde que les jeux de l'étagère jouables à ce nombre. Clique sur une boîte pour le pitch et l'ambiance de table.</p>
  </section>

  <div class="filters">
    <div class="fgroup" id="f-dyn"><span>Dynamique</span></div>
    <div class="fgroup" id="f-time"><span>Durée</span></div>
  </div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</div>

<dialog id="dlg" aria-labelledby="d-title">
  <div class="dhead">
    <div class="eyebrow" id="d-cat"></div>
    <h2 id="d-title"></h2>
    <button class="close" id="d-close" aria-label="Fermer">×</button>
  </div>
  <div class="dbody">
    <div><h3>Le jeu</h3><p id="d-pitch"></p></div>
    <div><h3>L'ambiance à table</h3><p id="d-dyn"></p></div>
    <div class="facts">
      <div class="fact"><b id="d-time"></b><small>durée</small></div>
      <div class="fact"><b id="d-pl"></b><small>joueurs</small></div>
      <div class="fact"><b id="d-own"></b><small>qui l'a</small></div>
    </div>
    <div>
      <div class="range" id="d-range"></div>
      <div class="rlabels" id="d-rl"></div>
    </div>
  </div>
</dialog>

<script>
const DYN = {
  coop:  {label:"Coop", color:"var(--coop)"},
  solo:  {label:"Chacun pour soi", color:"var(--solo)"},
  team:  {label:"Équipes", color:"var(--team)"},
  hidden:{label:"Bluff & rôles cachés", color:"var(--hidden)"},
  party: {label:"Ambiance & quiz", color:"var(--party)"}
};
const TIME = {short:"≤ 20 min", mid:"25–50 min", long:"1 h et +"};

/* n, d(dynamique), min, max, m(durée en min), own, star, tag, p(pitch), y(ambiance) */
const GAMES = [
 {n:"The Mind", d:"coop", min:2, max:4, m:20, own:"?",
  tag:"Poser des cartes dans l'ordre… sans se parler.",
  p:"Chacun a des cartes numérotées de 1 à 100. Ensemble, il faut les poser au centre dans l'ordre croissant, sans aucune communication. Chaque niveau ajoute une carte en main.",
  y:"Silence total, regards appuyés et fous rires quand quelqu'un pose un 87 trop tôt. Aucune règle à retenir."},
 {n:"Bomb Busters", d:"coop", min:2, max:5, m:20, own:"Guigz", star:4,
  tag:"Désamorcer une bombe par déduction collective.",
  p:"Chacun a une rangée de fils numérotés cachés. À tour de rôle, on désigne un fil chez un partenaire en annonçant sa valeur : si c'est juste, on le coupe, sinon la bombe se rapproche de l'explosion. Des dizaines de missions de plus en plus corsées.",
  y:"On réfléchit à voix haute, avec une petite tension à chaque coupe. On enchaîne les missions sans s'en rendre compte."},
 {n:"Qwixx", d:"solo", min:2, max:5, m:15, own:"Clem",
  tag:"Cocher des cases avec les dés de tout le monde.",
  p:"On lance des dés de couleur et chacun coche des chiffres sur quatre lignes, en ordre croissant ou décroissant. Tout le monde peut utiliser le lancer des autres.",
  y:"Zéro temps mort : tout le monde joue à chaque lancer. Parfait quand on n'a pas envie de trop réfléchir."},
 {n:"Trio", d:"solo", min:3, max:6, m:15, own:"Guigz",
  tag:"Mémoire et déduction pour réunir trois cartes identiques.",
  p:"On révèle des cartes : la plus petite ou la plus grande de la main d'un joueur, ou une carte face cachée au centre. Le but est de retourner trois cartes identiques d'affilée.",
  y:"On se surveille, on se trompe, on se moque de sa propre mémoire. Les règles tiennent en deux phrases."},
 {n:"Flip 7", d:"solo", min:3, max:18, m:20, own:"coloc", star:3,
  tag:"Retourner une carte de plus… ou pas.",
  p:"Push-your-luck pur : on retourne des cartes une par une sans jamais tomber sur un doublon. On s'arrête quand on veut pour sécuriser ses points ; 7 cartes différentes donnent un gros bonus.",
  y:"Bruyant et chambreur. Idéal pour lancer une soirée, et ça marche même à 15."},
 {n:"Love Letter", d:"solo", min:2, max:4, m:20, own:"Clem",
  tag:"16 cartes, une main d'une carte, beaucoup de déduction.",
  p:"On a une seule carte en main et on en pioche une seconde avant d'en jouer une. Chaque personnage a un pouvoir : deviner la main d'un adversaire, comparer, se protéger… Le dernier en lice remporte la manche.",
  y:"Manches de deux minutes, éliminations rapides et petits bluffs. Tient dans une poche."},
 {n:"Time Bomb", d:"hidden", min:4, max:8, m:15, own:"Clem",
  tag:"Équipe Sherlock contre équipe Moriarty.",
  p:"Chacun reçoit un rôle secret et des fils à couper. Les Sherlock veulent trouver tous les fils de désamorçage, les Moriarty veulent faire exploser la bombe. On annonce ce qu'on a en main, et on peut mentir.",
  y:"Accusations, alibis et mauvaise foi assumée. Meilleur à 6 ou plus."},
 {n:"Codenames Images", d:"team", min:4, max:8, m:15, own:"Clem",
  tag:"Faire deviner des images avec un seul mot.",
  p:"Deux équipes, un espion dans chaque. L'espion donne un mot et un nombre pour faire deviner plusieurs images de son camp, en évitant celles de l'adversaire et l'assassin.",
  y:"Les débats entre devineurs font la moitié du plaisir. Bon test de complicité."},
 {n:"Magic Maze", d:"coop", min:1, max:8, m:30, own:"Clem",
  tag:"Braquage en temps réel, chacun contrôle une direction.",
  p:"Quatre héros doivent voler leur équipement dans un centre commercial et s'enfuir avant la fin du sablier. Personne ne contrôle un pion : chacun a une action (aller au nord, prendre un escalator…) valable pour tous.",
  y:"Interdiction de parler, sauf un gros pion « Fais quelque chose ! » qu'on pose devant celui qui n'a pas vu. Chaotique et très drôle."},
 {n:"Hanabi", d:"coop", min:2, max:5, m:30, own:"Fab",
  tag:"Tu vois les cartes de tout le monde, sauf les tiennes.",
  p:"On tient ses cartes à l'envers. Ensemble, on construit des feux d'artifice par couleur en posant les cartes dans l'ordre. Les indices sont limités : une couleur ou une valeur, rien d'autre.",
  y:"Coop calme et cérébral, où l'on apprend à lire les intentions des autres."},
 {n:"Top Ten", d:"coop", min:4, max:9, m:30, own:"Guigz",
  tag:"Classer des réponses absurdes de 1 à 10.",
  p:"Chacun a un chiffre secret de 1 à 10. On tire un thème (« une excuse pour arriver en retard, de nulle à parfaite ») et chacun répond selon son chiffre. Le capitaine doit remettre tout le monde dans l'ordre.",
  y:"Parfait pour se découvrir. On rit beaucoup et personne ne perd vraiment."},
 {n:"Micro Macro : Crime City", d:"coop", min:1, max:4, m:30, own:"Guigz",
  tag:"Enquêtes cherche-et-trouve sur un plan de ville géant.",
  p:"Un immense plan en noir et blanc fourmille de scènes. Chaque affaire pose des questions, et on retrace l'histoire en repérant les indices dans le dessin.",
  y:"Tout le monde penché sur la même carte, le doigt tendu. Zéro compétition."},
 {n:"Micro Macro : Full House", d:"coop", min:1, max:4, m:30, own:"Guigz",
  tag:"La suite de Crime City, avec de nouvelles affaires.",
  p:"Même principe que Crime City : un grand plan illustré et des enquêtes à résoudre en repérant les scènes clés, avec de nouvelles affaires.",
  y:"Aussi accessible que le premier. Se joue sans l'avoir fait."},
 {n:"Skull King", d:"solo", min:2, max:6, m:30, own:"Guigz",
  tag:"Jeu de plis où il faut parier juste.",
  p:"À chaque manche, on annonce combien de plis on va remporter. Pirates, sirènes et Skull King bousculent les plis classiques. On ne marque que si l'on tombe pile sur son pari.",
  y:"Très interactif : on fait rater les autres autant qu'on joue pour soi. La tension monte au fil des manches."},
 {n:"Perudo", d:"hidden", min:2, max:6, m:30, own:"Guigz",
  tag:"Bluff aux dés sous gobelet.",
  p:"Chacun secoue ses dés sous un gobelet. On enchérit sur le nombre total de dés d'une valeur sur toute la table. Le suivant surenchérit ou conteste ; le perdant perd un dé.",
  y:"Bruit de gobelets et poker face. Règles en une minute."},
 {n:"Courtisans", d:"hidden", min:2, max:6, m:30, own:"Guigz",
  tag:"Influencer la cour de la Reine, missions secrètes.",
  p:"À son tour, on joue trois cartes : une qui rend une famille favorable à la cour, une qui la discrédite, une qu'on garde pour soi. Des missions secrètes rapportent des points bonus.",
  y:"Des coups de couteau dans le dos feutrés et rapides."},
 {n:"Cascadia", d:"solo", min:1, max:4, m:38, own:"Guigz",
  tag:"Composer un paysage et y placer des animaux.",
  p:"On drafte des tuiles d'habitat et des jetons animaux pour bâtir son coin de nature. Chaque espèce rapporte selon un motif (ours en paires, saumons en rivière…).",
  y:"Peu d'interaction, ambiance détendue : chacun construit son joli puzzle."},
 {n:"Carcassonne", d:"solo", min:2, max:5, m:35, own:"Fab",
  tag:"Poser des tuiles pour bâtir villes, routes et abbayes.",
  p:"On pioche une tuile, on la pose pour agrandir le paysage commun, puis on peut y placer un partisan pour revendiquer une ville, une route ou un pré. L'extension Moutons est dans la boîte.",
  y:"Un classique ultra accessible. Le territoire est partagé, donc on se pique des villes."},
 {n:"7 Wonders", d:"solo", min:3, max:7, m:30, own:"Fab",
  tag:"Draft simultané pour développer sa civilisation.",
  p:"Sur trois âges, chacun choisit une carte dans sa main et passe le reste à son voisin. On développe ressources, armée, science et bâtiments pour marquer le plus de points.",
  y:"Tout le monde joue en même temps, donc ça reste rapide même à 7. La première partie est un peu dense."},
 {n:"Mysterium", d:"coop", min:2, max:7, m:42, own:"Fab",
  tag:"Un fantôme muet, des médiums qui interprètent des rêves.",
  p:"Un joueur incarne le fantôme et ne parle pas. Il envoie des cartes-visions très illustrées pour orienter chaque médium vers un suspect, un lieu et une arme.",
  y:"Débats passionnés sur des dessins abstraits. Parfait pour un groupe imaginatif."},
 {n:"Pandemic", d:"coop", min:2, max:4, m:45, own:"Fab",
  tag:"Endiguer quatre épidémies mondiales en équipe.",
  p:"Chacun a un rôle spécial (médecin, chercheuse, logisticien…). On voyage, on soigne et on échange des cartes pour découvrir les quatre remèdes avant que les foyers ne débordent.",
  y:"Une réunion de crise sur plateau. Attention au joueur qui veut jouer pour tout le monde."},
 {n:"Challengers!", d:"solo", min:1, max:8, m:53, own:"Guigz", star:4,
  tag:"Tournoi de deck-building en duels automatiques.",
  p:"À chaque manche, on ajoute des cartes à son paquet, puis on affronte un adversaire en duel. Les combats se jouent presque tout seuls : tout se décide dans la construction du deck.",
  y:"Facile à apprendre, fun à regarder, et ça tient jusqu'à 8."},
 {n:"Catane", d:"solo", min:3, max:6, m:75, own:"Fab / Mentre", star:4,
  tag:"Coloniser une île en commerçant ses ressources.",
  p:"On lance les dés pour produire bois, argile, laine, blé et minerai, qu'on échange pour construire routes, colonies et villes. Premier à 10 points. L'extension 5-6 joueurs et Villes & Chevaliers sont dispo.",
  y:"Les négociations font tout le sel : alliances d'un tour et trahisons commerciales."},
 {n:"Smallworld", d:"solo", min:2, max:5, m:60, own:"Guigz", star:5,
  tag:"Conquérir un monde trop petit avec des peuples farfelus.",
  p:"Chacun choisit un combo peuple + pouvoir, conquiert des régions, puis met ce peuple en déclin pour en prendre un nouveau.",
  y:"Conflit direct mais bon enfant, combos absurdes. Le chouchou de la coloc."},
 {n:"6 qui prend !", d:"solo", min:2, max:10, m:30, own:"?",
  tag:"Éviter de ramasser les têtes de bœuf.",
  p:"Tout le monde choisit une carte en secret, puis on les place dans l'ordre sur quatre rangées. Celui qui pose la sixième carte d'une rangée la ramasse, avec ses têtes de bœuf.",
  y:"Simple, rapide et cruel. Un des meilleurs jeux pour les grandes tablées."},
 {n:"6 qui surprend", d:"solo", min:2, max:10, m:30, own:"Clem",
  tag:"Une variante de 6 qui prend avec des effets en plus.",
  p:"Le principe des rangées et des têtes de bœuf de 6 qui prend, enrichi de cartes qui changent les règles du tour.",
  y:"Pour ceux qui connaissent déjà 6 qui prend et veulent du chaos en plus."},
 {n:"Citadelles", d:"hidden", min:2, max:7, m:45, own:"Fab, Clem",
  tag:"Choisir un rôle en secret et bâtir sa cité.",
  p:"À chaque tour, les joueurs se passent les personnages et en choisissent un en secret : assassin, voleur, roi, marchand… Chaque rôle a un pouvoir, et on construit des quartiers pour gagner des points.",
  y:"On devine qui a pris quoi, on assassine au hasard et on se venge au tour suivant."},
 {n:"Terraforming Mars", d:"solo", min:1, max:5, m:120, own:"Mentre, Clem/Guigz", star:5,
  tag:"Rendre Mars habitable, carte après carte.",
  p:"Chaque joueur dirige une corporation qui pose océans, forêts et villes et fait monter température et oxygène. Plus de 200 cartes projet, à combiner pour optimiser son moteur. Les extensions Prélude, Venus Next et Colonies sont dispo.",
  y:"Long et absorbant, avec assez peu d'interaction. À sortir avec des joueurs motivés : la coloc l'adore."},
 {n:"Root", d:"solo", min:2, max:4, m:135, own:"Clem",
  tag:"Guerre de la forêt avec des factions toutes différentes.",
  p:"Chats, oiseaux, alliance des bois, vagabond… Chaque faction a ses propres règles et sa propre façon de gagner.",
  y:"Très riche mais exigeant : il faut un connaisseur pour l'expliquer. Grosse soirée garantie."},
 {n:"Cartaventura Vinland", d:"coop", min:1, max:6, m:60, own:"?",
  tag:"Aventure narrative chez les Vikings.",
  p:"On explore une carte qui se dévoile au fil des cartes piochées, en faisant des choix qui orientent l'histoire vers l'une des différentes fins.",
  y:"Tout le monde décide ensemble : une sorte de livre dont vous êtes le héros, à plusieurs."},
 {n:"Forêt", d:"solo", min:2, max:4, m:30, own:"Clem",
  tag:"Petit jeu de stratégie sur le thème de la nature.",
  p:"Un jeu de stratégie autour de la forêt, en 30 minutes environ.",
  y:"Format court, à tester avec Clem qui connaît les règles."},
 {n:"Migrato", d:"solo", min:2, max:4, m:20, own:"Clem",
  tag:"Jeu de cartes stratégique et rapide.",
  p:"Un jeu de cartes de stratégie qui se joue en une vingtaine de minutes.",
  y:"Format court, à tester avec Clem qui connaît les règles."},

const state = {n:4, dyn:"all", time:"all"};
try{ const v=parseInt(localStorage.getItem('monge-n'),10); if(v>=1&&v<=10) state.n=v; }catch(e){}

const tb = m => m<=20 ? "short" : m<=50 ? "mid" : "long";
const fmtDur = m => m>=60 ? (m%60 ? `${Math.floor(m/60)} h ${String(Math.round(m%60)).padStart(2,'0')}` : `${m/60} h`) : `${Math.round(m)} min`;
const fmtPl = g => g.min===g.max ? `${g.min}` : g.max>=20 ? `${g.min}+` : `${g.min}–${g.max}`;
const fits = (g,n) => n>=10 ? g.max>=10 : (g.min<=n && n<=g.max);

const picker=document.getElementById('picker');
for(let i=1;i<=10;i++){
  const b=document.createElement('button');
  b.className='pk'; b.type='button'; b.id='pk-'+i; b.textContent = i===10 ? '10+' : i;
  b.setAttribute('aria-label', i===10 ? '10 joueurs ou plus' : `${i} joueur${i>1?'s':''}`);
  b.onclick=()=>{ state.n=i; try{localStorage.setItem('monge-n',i)}catch(e){} render(); };
  picker.appendChild(b);
}

function chips(id, key, opts){
  const box=document.getElementById(id);
  [["all","Tous"], ...Object.entries(opts).map(([k,v])=>[k, v.label||v])].forEach(([k,l])=>{
    const b=document.createElement('button');
    b.className='chip'; b.type='button'; b.id=`chip-${key}-${k}`; b.textContent=l;
    b.setAttribute('aria-pressed', k==="all");
    b.onclick=()=>{ state[key]=k; box.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed', c===b)); render(); };
    box.appendChild(b);
  });
}
chips('f-dyn','dyn',DYN); chips('f-time','time',TIME);

const stars = n => n ? "★".repeat(n)+"☆".repeat(5-n) : "";
const grid=document.getElementById('grid'), cnt=document.getElementById('count');

function render(){
  document.getElementById('big').textContent = state.n===10 ? '10+' : state.n;
  picker.querySelectorAll('.pk').forEach((b,i)=>b.setAttribute('aria-pressed', i+1===state.n));
  const list = GAMES.filter(g=>fits(g,state.n)&&(state.dyn==="all"||g.d===state.dyn)&&(state.time==="all"||tb(g.m)===state.time))
    .sort((a,b)=>a.m-b.m || a.n.localeCompare(b.n,'fr'));
  const lbl = state.n===10 ? '10 joueurs et plus' : `${state.n} joueur${state.n>1?'s':''}`;
  cnt.innerHTML = `<b>${list.length}</b> jeu${list.length>1?'x':''} pour ${lbl}, du plus court au plus long`;
  grid.innerHTML='';
  if(!list.length){ grid.innerHTML='<div class="empty">Aucun jeu ne correspond. Essaie une autre dynamique ou une autre durée.</div>'; return; }
  list.forEach(g=>{
    const b=document.createElement('button');
    b.className='game'; b.type='button'; b.style.setProperty('--c', DYN[g.d].color);
    b.innerHTML=`<div class="spine"></div><div class="gbody"><div class="gname"></div><div class="gtag"></div>
      <div class="meta"><span class="pill dyn">${DYN[g.d].label}</span><span class="pill">${fmtDur(g.m)}</span><span class="pill">${fmtPl(g)} j.</span>${g.star?`<span class="pill" title="Note de la coloc">${stars(g.star)}</span>`:''}</div></div>`;
    b.querySelector('.gname').textContent=g.n; b.querySelector('.gtag').textContent=g.tag;
    b.onclick=()=>open(g);
    grid.appendChild(b);
  });
}

const dlg=document.getElementById('dlg');
function open(g){
  dlg.style.setProperty('--c', DYN[g.d].color);
  document.getElementById('d-cat').textContent = DYN[g.d].label;
  document.getElementById('d-title').textContent=g.n;
  document.getElementById('d-pitch').textContent=g.p;
  document.getElementById('d-dyn').textContent=g.y;
  document.getElementById('d-time').textContent=fmtDur(g.m);
  document.getElementById('d-pl').textContent=fmtPl(g);
  document.getElementById('d-own').textContent=g.own;
  const top=10, r=document.getElementById('d-range'); r.innerHTML='';
  for(let i=1;i<=top;i++){
    const s=document.createElement('i');
    const on = i===10 ? g.max>=10 : (i>=g.min&&i<=g.max);
    if(on) s.className = i===state.n ? 'on sel' : 'on';
    r.appendChild(s);
  }
  const who = state.n===10 ? '10+' : state.n;
  document.getElementById('d-rl').innerHTML = `<span>1</span><span>vous êtes ${who}</span><span>10+</span>`;
  dlg.showModal();
}
document.getElementById('d-close').onclick=()=>dlg.close();
dlg.addEventListener('click',e=>{ if(e.target===dlg) dlg.close(); });
render();
</script>
